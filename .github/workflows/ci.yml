name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        node-version: [20, 22]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (src, scripts, bake)
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: MCP protocol tests
        run: npm run test:mcp

      - name: Bake scenarios
        run: npm run bake

      - name: Determinism check
        run: npm run determinism

      - name: Package smoke install
        run: npm run smoke

      - name: Package content guard
        run: |
          npm pack --dry-run 2>&1 | tee pack.txt
          node -e "const out=require('fs').readFileSync('pack.txt','utf8'); if (out.includes('bake/') || out.includes('apps/')) { console.error('package must not include bake/ or apps/'); process.exit(1); }"
